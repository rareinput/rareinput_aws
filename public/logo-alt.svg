<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f5f3"/>
      <stop offset="100%" stop-color="#ebebea"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="99" x2="1584" y2="99" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="198" x2="1584" y2="198" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="297" x2="1584" y2="297" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="264" y1="0" x2="264" y2="396" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="528" y1="0" x2="528" y2="396" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="792" y1="0" x2="792" y2="396" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="1056" y1="0" x2="1056" y2="396" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="1320" y1="0" x2="1320" y2="396" stroke="#111111" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Large faint RI watermark -->
  <text
    x="920" y="220"
    font-family="Arial Black, sans-serif"
    font-size="480"
    font-weight="900"
    fill="#111111"
    fill-opacity="0.03"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-20"
  >RI</text>

  <!-- Left accent bar -->
  <rect x="80" y="120" width="3" height="156" fill="#111111" opacity="0.8"/>

  <!-- RI Badge Mark -->
  <polygon points="110,108 218,108 218,228 206,244 110,244" fill="#111111"/>
  <text
    x="164" y="176"
    font-family="Arial Black, sans-serif"
    font-size="80"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-3"
  >RI</text>

  <!-- RARE INPUT wordmark -->
  <text
    x="246" y="168"
    font-family="Arial Black, sans-serif"
    font-size="52"
    font-weight="900"
    fill="#111111"
    dominant-baseline="central"
    letter-spacing="4"
  >RARE INPUT</text>

  <!-- Tagline under wordmark -->
  <text
    x="248" y="214"
    font-family="Arial, sans-serif"
    font-size="14"
    font-weight="400"
    fill="#999999"
    dominant-baseline="central"
    letter-spacing="4"
  >DIGITAL GROWTH PARTNER</text>

  <!-- Right side divider -->
  <line x1="1100" y1="60" x2="1100" y2="336" stroke="#cccccc" stroke-width="1"/>

  <!-- Right side geometric accent -->
  <polygon points="1280,80 1484,80 1484,290 1464,316 1280,316" fill="none" stroke="#cccccc" stroke-width="1"/>
  <polygon points="1292,92 1472,92 1472,280 1456,302 1292,302" fill="none" stroke="#111111" stroke-width="0.5" opacity="0.15"/>

  <!-- Right side tagline -->
  <text
    x="1392" y="172"
    font-family="Arial, sans-serif"
    font-size="13"
    fill="#999999"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="3"
  >YOUR COMPLETE</text>
  <text
    x="1392" y="198"
    font-family="Arial Black, sans-serif"
    font-size="20"
    fill="#111111"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="2"
    font-weight="900"
  >DIGITAL GROWTH</text>
  <text
    x="1392" y="226"
    font-family="Arial Black, sans-serif"
    font-size="20"
    fill="#111111"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="2"
    font-weight="900"
  >PARTNER</text>

  <!-- Website URL bottom right -->
  <text
    x="1504" y="366"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#aaaaaa"
    text-anchor="end"
    letter-spacing="2"
  >rareinput.com</text>

</svg>
